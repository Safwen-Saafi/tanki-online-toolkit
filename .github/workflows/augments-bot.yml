name: Augments bot

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: augments-bot
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install bot dependencies
        working-directory: bot
        run: npm ci

      - name: Install Chromium
        working-directory: bot
        run: npx playwright install --with-deps chromium

      - name: Build
        working-directory: bot
        run: npm run build

      # A language that fails validation is skipped by the publish step, so a failure here must not
      # stop the other language from publishing. The job is failed at the end instead.
      - name: Scrape
        id: scrape
        continue-on-error: true
        working-directory: bot
        run: npm run scrape

      # The data branch holds the two augment files and nothing else.
      - name: Prepare the data branch
        run: |
          git config user.name "tanki-augments-bot"
          git config user.email "tanki-augments-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch origin data:refs/remotes/origin/data
            git worktree add data-branch -B data origin/data
          else
            git worktree add --orphan -b data data-branch
          fi

      # shell: bash turns on pipefail, so a failing publish is not hidden by tee.
      - name: Publish only what changed
        id: publish
        continue-on-error: true
        shell: bash
        working-directory: bot
        run: npm run --silent scrape -- --publish ../data-branch --message-file "$RUNNER_TEMP/commit-message.txt" | tee "$RUNNER_TEMP/publish.txt"

      # A commit is made only when a file really changed, and its message says which augments changed.
      - name: Commit and push the data branch
        id: commit
        run: |
          cat "$RUNNER_TEMP/publish.txt" >> "$GITHUB_STEP_SUMMARY" || true
          cd data-branch
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed, nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            test -s "$RUNNER_TEMP/commit-message.txt" || echo "augments: update" > "$RUNNER_TEMP/commit-message.txt"
            git commit -F "$RUNNER_TEMP/commit-message.txt"
            git push origin data
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail the run if anything went wrong
        if: steps.scrape.outcome == 'failure' || steps.publish.outcome == 'failure'
        run: |
          echo "The scrape or the publish step failed; see the logs above."
          exit 1

  # Publishing to the site. It runs after every successful check, even when nothing changed, because the deploy
  # also records when the wiki was last checked. It also runs when one language was published and the other was
  # rejected (the failure step above fired), so the language that did change goes live.
  deploy:
    needs: scrape-and-publish
    if: always() && (needs.scrape-and-publish.result == 'success' || needs.scrape-and-publish.outputs.changed == 'true')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
